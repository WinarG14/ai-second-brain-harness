<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="read-cost-title read-cost-desc" id="read-cost-root">
      <title id="read-cost-title">The agent reads a small part of what you store</title>
      <desc id="read-cost-desc">Bar chart. In the starter copy the agent reads 10.3 of 43.9 KB for one lookup. With 5 more packs it reads 35.6 of 675.3 KB, so the stored text grows 15 times and the text read grows 3.5 times.</desc>
      <defs>
      <style>#read-cost-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #read-cost-root { color: var(--ink); font-family: var(--sans); }
      #read-cost-root .diagram-container { overflow-x: auto; }
      #read-cost-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #read-cost-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #read-cost-root .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #read-cost-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #read-cost-root .hub { fill: var(--ink); }
      #read-cost-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #read-cost-root .focal-name { fill: var(--accent); }
      #read-cost-root .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
      #read-cost-root .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
      #read-cost-root .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
      #read-cost-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      #read-cost-root .zone { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.30); stroke-width: 1; stroke-dasharray: 4 4; }
      #read-cost-root .zone-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
      #read-cost-root .node { fill: #ffffff; stroke: var(--ink); stroke-width: 1; }
      #read-cost-root .node.store { fill: rgba(45,49,66,0.05); stroke: var(--muted); }
      #read-cost-root .node.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #read-cost-root .tag { fill: none; stroke: rgba(45,49,66,0.40); stroke-width: 0.8; }
      #read-cost-root .tag-text { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
      #read-cost-root .conn { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #read-cost-root .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.08em; }
      #read-cost-root .grid { stroke: rgba(45,49,66,0.08); stroke-width: 0.8; }
      #read-cost-root .axis { stroke: rgba(45,49,66,0.25); stroke-width: 1; }
      #read-cost-root .tick { fill: var(--muted); font: 400 8px var(--mono); }
      #read-cost-root .cat { fill: var(--ink); font: 600 11px var(--sans); }
      #read-cost-root .callout { fill: var(--muted); font: italic 400 16px var(--serif); }
      #read-cost-root .lane-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }</style>
        <marker id="read-cost-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="1000" height="540" fill="#f5f5f5"/>
      <text x="72" y="423.0" class="tick" font-size="8" text-anchor="end">0</text>
      <line x1="80" y1="325.0" x2="960" y2="325.0" class="grid" data-lint="ignore"/>
      <text x="72" y="328.0" class="tick" font-size="8" text-anchor="end">200</text>
      <line x1="80" y1="230.0" x2="960" y2="230.0" class="grid" data-lint="ignore"/>
      <text x="72" y="233.0" class="tick" font-size="8" text-anchor="end">400</text>
      <line x1="80" y1="135.0" x2="960" y2="135.0" class="grid" data-lint="ignore"/>
      <text x="72" y="138.0" class="tick" font-size="8" text-anchor="end">600</text>
      <line x1="80" y1="40.0" x2="960" y2="40.0" class="grid" data-lint="ignore"/>
      <text x="72" y="43.0" class="tick" font-size="8" text-anchor="end">800</text>
      <line x1="80" y1="420" x2="960" y2="420" class="axis" data-lint="ignore"/>
      <line x1="80" y1="40" x2="80" y2="420" class="axis" data-lint="ignore"/>
      <text x="24" y="230" class="tick" font-size="7" letter-spacing="0.14em" text-anchor="middle" transform="rotate(-90 24 230)">TEXT, KB</text>
      <rect x="196" y="399.1" width="96" height="20.9" fill="#f5f5f5" data-lint="ignore"/>
      <rect x="196" y="399.1" width="96" height="20.9" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" data-lint="ignore" fill-opacity="0.15"/>
      <text x="244" y="391.1" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">43.9 KB</text>
      <rect x="308" y="415.1" width="96" height="4.9" fill="#f5f5f5" data-lint="ignore"/>
      <rect x="308" y="415.1" width="96" height="4.9" fill="#eb6c36" stroke="#eb6c36" stroke-width="1" data-lint="ignore" fill-opacity="0.12"/>
      <text x="356" y="395.1" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10.3 KB</text>
      <text x="356" y="407.1" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">23% of stored</text>
      <rect x="616" y="99.2" width="96" height="320.8" fill="#f5f5f5" data-lint="ignore"/>
      <rect x="616" y="99.2" width="96" height="320.8" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" data-lint="ignore" fill-opacity="0.15"/>
      <text x="664" y="91.2" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">675.3 KB</text>
      <rect x="728" y="403.1" width="96" height="16.9" fill="#f5f5f5" data-lint="ignore"/>
      <rect x="728" y="403.1" width="96" height="16.9" fill="#eb6c36" stroke="#eb6c36" stroke-width="1" data-lint="ignore" fill-opacity="0.12"/>
      <text x="776" y="383.1" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">35.6 KB</text>
      <text x="776" y="395.1" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5% of stored</text>
      <text x="300" y="444" class="cat" font-size="11" text-anchor="middle">Starter copy</text>
      <text x="300" y="460" class="tick" font-size="8" text-anchor="middle">36 files</text>
      <text x="720" y="444" class="cat" font-size="11" text-anchor="middle">With 5 more packs</text>
      <text x="720" y="460" class="tick" font-size="8" text-anchor="middle">142 files</text>
      <text x="120" y="164" class="callout" font-size="16">The stored text grows 15 times.</text>
      <text x="120" y="188" class="callout" font-size="16">The text read for one lookup grows 3.5 times.</text>
      <line x1="40" y1="484" x2="960" y2="484" stroke="#2d3142" stroke-width="0.8" data-lint="ignore" stroke-opacity="0.10"/>
      <text x="40" y="508" class="legend" font-size="8">LEGEND</text>
      <rect x="120" y="498" width="16" height="12" rx="2" fill="#4f5d75" stroke="#4f5d75" data-lint="ignore" fill-opacity="0.15"/>
      <text x="144" y="508" class="legend" font-size="8">ALL STORED TEXT</text>
      <rect x="300" y="498" width="16" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" data-lint="ignore" fill-opacity="0.12"/>
      <text x="324" y="508" class="legend" font-size="8">TEXT READ FOR ONE LOOKUP</text>
    </svg>
