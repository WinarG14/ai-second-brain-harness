<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What the agent reads and writes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .diagram-container { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1000px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      .zone { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.30); stroke-width: 1; stroke-dasharray: 4 4; }
    .zone-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .node { fill: #ffffff; stroke: var(--ink); stroke-width: 1; }
    .node.store { fill: rgba(45,49,66,0.05); stroke: var(--muted); }
    .node.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .tag { fill: none; stroke: rgba(45,49,66,0.40); stroke-width: 0.8; }
    .tag-text { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
    .conn { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">AI second brain</p>
    <h1>What the agent reads and writes</h1>
    <div class="diagram-container">
    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="read-write-title read-write-desc">
      <title id="read-write-title">What the agent reads and writes</title>
      <desc id="read-write-desc">The agent reads the rules, skills and pack knowledge that git shares. It writes your status, logs, memory and finished work only on your own PC, where git ignores them.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="1000" height="440" fill="#f5f5f5"/>
      <rect class="zone" x="40" y="60" width="280" height="296" rx="8"/>
      <text x="56" y="80" class="zone-label" font-size="8">IN GIT, SHARED</text>
      <rect class="zone" x="704" y="60" width="256" height="296" rx="8"/>
      <text x="720" y="80" class="zone-label" font-size="8">ONLY ON YOUR PC</text>
      <path class="conn" d="M280 136 H336 Q344 136 344 144 V192 Q344 200 352 200 H398" marker-end="url(#arrow)"/>
      <path class="conn" d="M280 288 H360 Q368 288 368 280 V232 Q368 224 376 224 H398" marker-end="url(#arrow)"/>
      <path class="conn" d="M600 200 H648 Q656 200 656 192 V144 Q656 136 664 136 H734" marker-end="url(#arrow)"/>
      <path class="conn" d="M600 224 H672 Q680 224 680 232 V280 Q680 288 688 288 H734" marker-end="url(#arrow)"/>
      <rect x="288" y="116" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="308" y="125" class="arrow-label" font-size="8" text-anchor="middle">READS</text>
      <rect x="292" y="268" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="277" class="arrow-label" font-size="8" text-anchor="middle">READS</text>
      <rect x="668" y="116" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="694" y="125" class="arrow-label" font-size="8" text-anchor="middle">RECORDS</text>
      <rect x="688" y="268" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="708" y="277" class="arrow-label" font-size="8" text-anchor="middle">SAVES</text>
      <rect x="80" y="100" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect class="node store" x="80" y="100" width="200" height="72" rx="6"/>
      <rect class="tag" x="88" y="108" width="40" height="12" rx="2"/>
      <text x="108" y="117" class="tag-text" font-size="7" text-anchor="middle">CORE</text>
      <text x="180" y="140" class="node-name" font-size="12" text-anchor="middle">Rules and skills</text>
      <text x="180" y="156" class="sublabel" font-size="8" text-anchor="middle">core/</text>
      <rect x="80" y="252" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect class="node store" x="80" y="252" width="200" height="72" rx="6"/>
      <rect class="tag" x="88" y="260" width="40" height="12" rx="2"/>
      <text x="108" y="269" class="tag-text" font-size="7" text-anchor="middle">PACKS</text>
      <text x="180" y="292" class="node-name" font-size="12" text-anchor="middle">Your knowledge</text>
      <text x="180" y="308" class="sublabel" font-size="8" text-anchor="middle">packs/name/</text>
      <rect x="400" y="176" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect class="node focal" x="400" y="176" width="200" height="72" rx="6"/>
      <rect class="tag" x="408" y="184" width="40" height="12" rx="2"/>
      <text x="428" y="193" class="tag-text" font-size="7" text-anchor="middle">AGENT</text>
      <text x="500" y="216" class="node-name focal-name" font-size="12" text-anchor="middle">Claude Code or Codex</text>
      <text x="500" y="232" class="sublabel" font-size="8" text-anchor="middle">AGENTS.md</text>
      <rect x="736" y="100" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect class="node store" x="736" y="100" width="200" height="72" rx="6"/>
      <rect class="tag" x="744" y="108" width="40" height="12" rx="2"/>
      <text x="764" y="117" class="tag-text" font-size="7" text-anchor="middle">LOCAL</text>
      <text x="836" y="140" class="node-name" font-size="12" text-anchor="middle">Your status and memory</text>
      <text x="836" y="156" class="sublabel" font-size="8" text-anchor="middle">local/</text>
      <rect x="736" y="252" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect class="node store" x="736" y="252" width="200" height="72" rx="6"/>
      <rect class="tag" x="744" y="260" width="40" height="12" rx="2"/>
      <text x="764" y="269" class="tag-text" font-size="7" text-anchor="middle">WORK</text>
      <text x="836" y="292" class="node-name" font-size="12" text-anchor="middle">Your finished work</text>
      <text x="836" y="308" class="sublabel" font-size="8" text-anchor="middle">work/</text>
      <line x1="40" y1="388" x2="960" y2="388" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" data-lint="ignore"/>
      <text x="40" y="412" class="legend" font-size="8">LEGEND</text>
      <path d="M120 408 H160" class="conn" marker-end="url(#arrow)" data-lint="ignore"/>
      <text x="168" y="412" class="legend" font-size="8">THE AGENT READS OR WRITES</text>
      <rect x="380" y="402" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" data-lint="ignore"/>
      <text x="404" y="412" class="legend" font-size="8">THE AGENT</text>
      <rect x="500" y="402" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" data-lint="ignore"/>
      <text x="524" y="412" class="legend" font-size="8">A STORE OF FILES</text>
    </svg>
    </div>
  </main>
</body>
</html>
