<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-loop-title session-loop-desc" id="session-loop-root">
      <title id="session-loop-title">How one session works</title>
      <desc id="session-loop-desc">Six steps go clockwise: you ask, the agent reads the rules, finds one file, does the work, saves new knowledge and records the session. The last two steps write into your second brain, so the next session starts with more.</desc>
      <defs>
      <style>#session-loop-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #session-loop-root { color: var(--ink); font-family: var(--sans); }
      #session-loop-root .diagram-container { overflow-x: auto; }
      #session-loop-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #session-loop-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #session-loop-root .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #session-loop-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #session-loop-root .hub { fill: var(--ink); }
      #session-loop-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #session-loop-root .focal-name { fill: var(--accent); }
      #session-loop-root .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
      #session-loop-root .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
      #session-loop-root .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
      #session-loop-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }</style>
        <marker id="session-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="session-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>
      <rect width="1040" height="680" fill="#f5f5f5"/>
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#session-loop-arrow)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#session-loop-arrow)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#session-loop-arrow)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#session-loop-arrow)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#session-loop-arrow)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#session-loop-arrow)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#session-loop-arrow-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#session-loop-arrow-soft)"/>
      <rect x="404" y="420" width="60" height="16" rx="4" fill="#f5f5f5"/>
      <text x="434" y="432" class="arrow-label" font-size="8" text-anchor="middle">NEW FACTS</text>
      <rect x="404" y="244" width="52" height="16" rx="4" fill="#f5f5f5"/>
      <text x="430" y="256" class="arrow-label" font-size="8" text-anchor="middle">RECORDS</text>
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name" font-size="12" text-anchor="middle">Ask for a task</text><text x="520" y="116" class="sublabel" font-size="8" text-anchor="middle">a question or a job</text>
      <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name" font-size="12" text-anchor="middle">Read the rules</text><text x="728" y="236" class="sublabel" font-size="8" text-anchor="middle">boot card and router</text>
      <rect class="station" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name" font-size="12" text-anchor="middle">Find one file</text><text x="728" y="476" class="sublabel" font-size="8" text-anchor="middle">pack index, then 1 file</text>
      <rect class="station" x="440" y="548" width="160" height="64" rx="6"/>
      <text x="520" y="576" class="node-name" font-size="12" text-anchor="middle">Do the work</text><text x="520" y="596" class="sublabel" font-size="8" text-anchor="middle">asks before outside writes</text>
      <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
      <text x="312" y="456" class="node-name" font-size="12" text-anchor="middle">Save new knowledge</text><text x="312" y="476" class="sublabel" font-size="8" text-anchor="middle">add-knowledge, after your OK</text>
      <rect class="station focal" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name focal-name" font-size="12" text-anchor="middle">Record the session</text><text x="312" y="236" class="sublabel" font-size="8" text-anchor="middle">status, logs and memory</text>
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name" font-size="16" text-anchor="middle">Your second brain</text>
      <text x="520" y="360" class="hub-sub" font-size="8" text-anchor="middle">packs and local memory</text>
    </svg>
